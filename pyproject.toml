[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uz-translit"
version = "0.1.0"
description = "Uzbek Cyrillic-Latin transliteration and passport-style romanisation of names and places"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["uzbek", "transliteration", "cyrillic", "latin", "romanization", "passport", "visa"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Natural Language :: Uzbek",
    "Topic :: Text Processing :: Linguistic",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
